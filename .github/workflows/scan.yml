 
name: Alpha Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: alpha-scanner-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Restore previous alert state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow=scan.yml \
            --branch="${{ github.ref_name }}" \
            --status=completed \
            --limit=30 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success")][0].databaseId // empty')

          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" \
              --name alpha-alert-state \
              --dir . || echo "No previous state artifact"
          fi
      - name: Verify restored alert state
        run: |
          if [ -f alpha_alert_state.json ]; then
            echo "STATE_RESTORE_OK"
          else
            echo "STATE_RESTORE_MISSING"
          fi
      - name: Run Alpha Scanner V3
        run: python alpha_scanner_v3.py
        env:
          DRY_RUN: "0"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_TOTAL_SCORE: "6"

    
      - name: Save alert state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-alert-state
          path: alpha_alert_state.json
          retention-days: 30
          if-no-files-found: ignore
