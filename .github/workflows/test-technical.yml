
name: Technical Analysis Tests

on:
  push:
    branches:
      - technical-analysis-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pandas

      - name: Run technical analysis tests
        run: python -m unittest -v test_technical_analysis.py
